<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 210px; font-family: sans-serif; padding: 14px; background: #222; color: #fff; margin: 0; }
    h3 { margin: 0 0 12px 0; font-size: 15px; color: #00A2FF; border-bottom: 1px solid #444; padding-bottom: 8px; }
    label { display: block; font-size: 11px; margin-bottom: 5px; color: #aaa; text-transform: uppercase; letter-spacing: 0.5px; }
    select { width: 100%; background: #333; color: #fff; border: 1px solid #555; padding: 5px; border-radius: 4px; outline: none; }
    .checkbox-row { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
    .checkbox-row input[type="checkbox"] { width: 14px; height: 14px; accent-color: #00A2FF; cursor: pointer; flex-shrink: 0; }
    .checkbox-row span { font-size: 11px; color: #aaa; text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; }
    button#save { width: 100%; margin-top: 12px; cursor: pointer; background: #00A2FF; border: none; color: white; padding: 8px; border-radius: 4px; font-weight: bold; }
    button#save:hover { background: #0081cc; }
    
    /* Discord Link Styling */
    .discord-link { 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        gap: 8px; 
        margin-top: 15px; 
        padding-top: 10px;
        border-top: 1px solid #333;
        text-decoration: none; 
        color: #5865F2; 
        font-size: 12px; 
        font-weight: bold;
        transition: opacity 0.2s;
    }
    .discord-link:hover { opacity: 0.8; }
    .discord-link svg { width: 18px; height: 18px; fill: currentColor; }
  </style>
</head>
<body>
  <h3>Server Suite</h3>

  <label for="prefSize">Preferred Server Size</label>
  <select id="prefSize">
    <option value="small">Smallest Servers</option>
    <option value="random">Pure Random</option>
  </select>

  <div class="checkbox-row">
    <input type="checkbox" id="excludeFull">
    <span onclick="document.getElementById('excludeFull').click()">Exclude Full Servers</span>
  </div>

  <button id="save">Save</button>
